# Purpose: temporarily transcribe and sample the exact public Moon validation video that was prospectively locked before reveal; the workflow is removed after the audit.
name: moonform-exact-validation-transcription

on:
  push:
    paths:
      - ".github/workflows/moonform-transcribe.yml"

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned transcription stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper==1.2.1" "requests==2.32.5"

      - name: Download and hash exact archived source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/frames
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          source = "https://archive.ventilaar.net/videos/automatic/UCmFeOdJI3IXgTBDzqBLD8qg/eGUzz-Yaf-U/how-conan-o-brien-changed-late-night-forever.mp4"
          dest = Path("out/conan_exact.mp4")
          h = hashlib.sha256()
          size = 0
          with requests.get(source, stream=True, timeout=180, headers={"User-Agent":"MoonformOS-ExactValidation/1.0"}) as r:
              r.raise_for_status()
              with dest.open("wb") as f:
                  for chunk in r.iter_content(1024 * 1024):
                      if chunk:
                          f.write(chunk); h.update(chunk); size += len(chunk)
          Path("out/source_metadata.json").write_text(json.dumps({
              "purpose":"Prove that the ASR and audiovisual audit used the exact prospectively locked Moon video, not the later podcast episode.",
              "title":"How Conan O'Brien Changed Late Night Forever",
              "youtube_id":"eGUzz-Yaf-U",
              "published":"2024-09-06",
              "archive_url":source,
              "downloaded_utc":datetime.now(timezone.utc).isoformat(),
              "bytes":size,
              "sha256":h.hexdigest(),
          }, indent=2), encoding="utf-8")
          print(json.dumps({"bytes":size,"sha256":h.hexdigest()}))
          PY
          ffprobe -v error -print_format json -show_format -show_streams out/conan_exact.mp4 > out/ffprobe.json

      - name: Capture exact audiovisual evidence
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i out/conan_exact.mp4 -vn -ac 1 -ar 16000 out/conan_exact.wav
          # One frame per minute plus a contact sheet preserves a compact visual audit trail.
          ffmpeg -hide_banner -loglevel error -y -i out/conan_exact.mp4 -vf "fps=1/60,scale=480:-1" out/frames/minute_%02d.jpg
          ffmpeg -hide_banner -loglevel error -y -i out/conan_exact.mp4 -vf "fps=1/60,scale=320:-1,tile=5x4" -frames:v 1 out/contact_sheet.jpg
          # Scene and silence logs are reproducible timing evidence for edit/audio pacing.
          ffmpeg -hide_banner -i out/conan_exact.mp4 -vf "select='gt(scene,0.30)',showinfo" -an -f null - 2> out/scene_detection.log || true
          ffmpeg -hide_banner -i out/conan_exact.wav -af "silencedetect=noise=-36dB:d=0.35" -f null - 2> out/silence_detection.log || true

      - name: Run two-checkpoint ASR audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import gc, hashlib, json, re
          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from pathlib import Path
          from faster_whisper import WhisperModel

          OUT=Path("out")
          AUDIO=OUT/"conan_exact.wav"
          TARGET="How Conan O'Brien Changed Late Night Forever"
          PROMPT="Conan O'Brien, Jay Leno, NBC, The Tonight Show, Late Night, David Letterman, Team Coco, TBS, Hollywood."

          def run(model_name:str, words:bool):
              model=WhisperModel(model_name, device="cpu", compute_type="int8", cpu_threads=4, num_workers=1)
              stream,info=model.transcribe(str(AUDIO),language="en",beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=True,vad_filter=True,vad_parameters={"min_silence_duration_ms":500},word_timestamps=words,initial_prompt=PROMPT)
              rows=[]
              for i,s in enumerate(stream):
                  row={"id":i,"start":round(float(s.start),3),"end":round(float(s.end),3),"text":s.text.strip(),"avg_logprob":round(float(s.avg_logprob),6),"no_speech_prob":round(float(s.no_speech_prob),6),"compression_ratio":round(float(s.compression_ratio),6)}
                  if words:
                      row["words"]=[{"start":round(float(w.start),3),"end":round(float(w.end),3),"word":w.word,"probability":round(float(w.probability),6)} for w in (s.words or []) if w.start is not None and w.end is not None]
                  rows.append(row)
              meta={"model":model_name,"language":info.language,"language_probability":float(info.language_probability),"duration":float(info.duration),"duration_after_vad":float(info.duration_after_vad),"transcribed_utc":datetime.now(timezone.utc).isoformat()}
              del model; gc.collect(); return rows,meta

          primary,pmeta=run("small.en",True)
          audit,ameta=run("base.en",False)
          ptext=" ".join(x["text"] for x in primary).strip()
          atext=" ".join(x["text"] for x in audit).strip()
          normal=lambda t:re.findall(r"[a-z0-9']+",t.lower())
          pw,aw=normal(ptext),normal(atext)
          matcher=SequenceMatcher(None,pw,aw,autojunk=False)
          payload={"purpose":"Timestamped primary transcript for the exact locked validation video.","target":TARGET,"metadata":pmeta,"segments":primary,"text":ptext}
          (OUT/"transcript_primary.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8")
          (OUT/"transcript_primary.txt").write_text(ptext+"\n",encoding="utf-8")
          (OUT/"transcript_audit_base.txt").write_text(atext+"\n",encoding="utf-8")
          (OUT/"asr_audit.json").write_text(json.dumps({"purpose":"Quantify independent ASR checkpoint agreement.","primary":pmeta,"audit":ameta,"primary_words":len(pw),"audit_words":len(aw),"sequence_match_ratio":matcher.ratio(),"matching_blocks":sum(x.size for x in matcher.get_matching_blocks()),"warning":"High agreement supports semantic analysis; direct quotation still requires audio spot-checking."},indent=2),encoding="utf-8")
          def ts(sec:float):
              ms=int(round(sec*1000));h,ms=divmod(ms,3600000);m,ms=divmod(ms,60000);s,ms=divmod(ms,1000);return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"
          lines=["WEBVTT","","NOTE Purpose: exact-source timed ASR evidence for Moonform validation.",""]
          for i,s in enumerate(primary,1): lines += [str(i),f"{ts(s['start'])} --> {ts(s['end'])}",s["text"],""]
          (OUT/"transcript_primary.vtt").write_text("\n".join(lines),encoding="utf-8")
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in OUT.glob("*") if p.is_file()}
          (OUT/"evidence_hashes.json").write_text(json.dumps({"purpose":"Detect any post-run modification of validation evidence.","sha256":hashes},indent=2),encoding="utf-8")
          print(json.dumps({"primary_words":len(pw),"audit_words":len(aw),"agreement":matcher.ratio(),"segments":len(primary)},indent=2))
          PY

      - name: Upload exact immutable validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonform-conan-exact-validation
          path: out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
