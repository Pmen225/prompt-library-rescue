# Purpose: temporarily transcribe one public Moon audio mirror for a prospectively locked, leakage-free validation test; the workflow and artifact are removed after the audit.
name: moonform-one-off-transcription

on:
  push:
    paths:
      - ".github/workflows/moonform-transcribe.yml"

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic transcription stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper==1.2.1" "requests==2.32.5"

      - name: Download, hash and transcribe the locked validation target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import gc
          import hashlib
          import json
          import re
          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from pathlib import Path

          import requests
          from faster_whisper import WhisperModel

          AUDIO_URL = "https://traffic.megaphone.fm/PODAGEN4727388267.mp3?updated=1778662635"
          TARGET = "How Conan O'Brien Exposed Hollywood | Moon"
          PRIMARY_MODEL = "small.en"
          AUDIT_MODEL = "base.en"
          INITIAL_PROMPT = "Conan O'Brien, Jay Leno, NBC, The Tonight Show, Late Night, David Letterman, Team Coco, TBS, Hollywood."
          OUT = Path("out")
          AUDIO = OUT / "conan.mp3"

          def download() -> None:
              h = hashlib.sha256()
              size = 0
              with requests.get(AUDIO_URL, stream=True, timeout=120, headers={"User-Agent": "MoonformOS-ASR/1.0"}) as r:
                  r.raise_for_status()
                  with AUDIO.open("wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)
                              h.update(chunk)
                              size += len(chunk)
              (OUT / "audio_metadata.json").write_text(json.dumps({
                  "purpose": "Prove which public audio was transcribed for the locked validation test.",
                  "target": TARGET,
                  "source_url": AUDIO_URL,
                  "downloaded_utc": datetime.now(timezone.utc).isoformat(),
                  "bytes": size,
                  "sha256": h.hexdigest(),
              }, indent=2), encoding="utf-8")

          def transcribe(model_name: str, *, words: bool):
              model = WhisperModel(model_name, device="cpu", compute_type="int8", cpu_threads=4, num_workers=1)
              stream, info = model.transcribe(
                  str(AUDIO),
                  language="en",
                  beam_size=5,
                  best_of=5,
                  temperature=0.0,
                  condition_on_previous_text=True,
                  vad_filter=True,
                  vad_parameters={"min_silence_duration_ms": 500},
                  word_timestamps=words,
                  initial_prompt=INITIAL_PROMPT,
              )
              segments = []
              for i, s in enumerate(stream):
                  row = {
                      "id": i,
                      "start": round(float(s.start), 3),
                      "end": round(float(s.end), 3),
                      "text": s.text.strip(),
                      "avg_logprob": round(float(s.avg_logprob), 6),
                      "no_speech_prob": round(float(s.no_speech_prob), 6),
                      "compression_ratio": round(float(s.compression_ratio), 6),
                  }
                  if words:
                      row["words"] = [
                          {"start": round(float(w.start), 3), "end": round(float(w.end), 3), "word": w.word, "probability": round(float(w.probability), 6)}
                          for w in (s.words or []) if w.start is not None and w.end is not None
                      ]
                  segments.append(row)
              meta = {
                  "model": model_name,
                  "language": info.language,
                  "language_probability": float(info.language_probability),
                  "duration": float(info.duration),
                  "duration_after_vad": float(info.duration_after_vad),
                  "transcribed_utc": datetime.now(timezone.utc).isoformat(),
              }
              del model
              gc.collect()
              return segments, meta

          def normalize(text: str):
              return re.findall(r"[a-z0-9']+", text.lower())

          def ts(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, ms = divmod(ms, 3_600_000)
              m, ms = divmod(ms, 60_000)
              s, ms = divmod(ms, 1000)
              return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"

          download()
          primary, primary_meta = transcribe(PRIMARY_MODEL, words=True)
          audit, audit_meta = transcribe(AUDIT_MODEL, words=False)
          primary_text = " ".join(x["text"] for x in primary).strip()
          audit_text = " ".join(x["text"] for x in audit).strip()
          a, b = normalize(primary_text), normalize(audit_text)
          matcher = SequenceMatcher(None, a, b, autojunk=False)
          agreement = matcher.ratio()

          primary_payload = {
              "purpose": "Timestamped primary transcript used to reveal and score the locked validation target.",
              "target": TARGET,
              "metadata": primary_meta,
              "segments": primary,
              "text": primary_text,
          }
          (OUT / "transcript_primary.json").write_text(json.dumps(primary_payload, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT / "transcript_primary.txt").write_text(primary_text + "\n", encoding="utf-8")
          (OUT / "transcript_audit_base.txt").write_text(audit_text + "\n", encoding="utf-8")
          (OUT / "asr_audit.json").write_text(json.dumps({
              "purpose": "Quantify agreement between two independently decoded Whisper checkpoints.",
              "primary": primary_meta,
              "audit": audit_meta,
              "primary_words": len(a),
              "audit_words": len(b),
              "sequence_match_ratio": agreement,
              "matching_blocks": sum(x.size for x in matcher.get_matching_blocks()),
              "interpretation": "High agreement supports semantic/structural analysis; source quotations still require spot-checking.",
          }, indent=2), encoding="utf-8")
          lines = ["WEBVTT", "", "NOTE Purpose: timed ASR evidence for Moonform validation.", ""]
          for i, s in enumerate(primary, 1):
              lines += [str(i), f"{ts(s['start'])} --> {ts(s['end'])}", s["text"], ""]
          (OUT / "transcript_primary.vtt").write_text("\n".join(lines), encoding="utf-8")
          print(json.dumps({"target": TARGET, "primary_words": len(a), "audit_words": len(b), "agreement": agreement, "segments": len(primary)}, indent=2))
          PY

      - name: Upload immutable transcript evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonform-conan-transcript
          path: out/
          if-no-files-found: error
          retention-days: 1
