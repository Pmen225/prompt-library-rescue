# Purpose: temporarily transcribe three public Moon videos adjacent to the failed Conan validation target, so formula revision is based on a small corpus rather than one exposed example; the workflow is removed after calibration.
name: moonform-adjacent-series-calibration

on:
  push:
    paths:
      - ".github/workflows/moonform-transcribe.yml"

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: conan_exposed
            id: W8vUJ6tu0iU
            title: "Idiot Late Night Hosts Exposed by Conan O'Brien (Accidentally)"
            url: "https://archive.ventilaar.net/videos/automatic/UCmFeOdJI3IXgTBDzqBLD8qg/W8vUJ6tu0iU/idiot-late-night-hosts-exposed-by-conan-o-brien-accidentally.webm"
            prompt: "Conan O'Brien, late night hosts, Hollywood, authenticity, celebrities, talk shows."
          - key: jim_carrey
            id: bZkHKAuGwY0
            title: "Idiot Celebrities Exposed by Jim Carrey"
            url: "https://archive.ventilaar.net/videos/automatic/UCmFeOdJI3IXgTBDzqBLD8qg/bZkHKAuGwY0/idiot-celebrities-exposed-by-jim-carrey.webm"
            prompt: "Jim Carrey, Hollywood, celebrities, fame, authenticity, awards, acting."
          - key: ricky_gervais
            id: eh4LovntZx4
            title: "Idiot Actors Exposed By Ricky Gervais"
            url: "https://archive.ventilaar.net/videos/automatic/UCmFeOdJI3IXgTBDzqBLD8qg/eh4LovntZx4/idiot-actors-exposed-by-ricky-gervais.webm"
            prompt: "Ricky Gervais, Hollywood, actors, Golden Globes, celebrities, authenticity."
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "4"
      TARGET_KEY: ${{ matrix.key }}
      TARGET_ID: ${{ matrix.id }}
      TARGET_TITLE: ${{ matrix.title }}
      TARGET_URL: ${{ matrix.url }}
      INITIAL_PROMPT: ${{ matrix.prompt }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ASR stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper==1.2.1" "requests==2.32.5"

      - name: Download, hash and transcribe exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          import av
          import requests
          from faster_whisper import WhisperModel

          key=os.environ['TARGET_KEY']; video_id=os.environ['TARGET_ID']; title=os.environ['TARGET_TITLE']
          source=os.environ['TARGET_URL']; prompt=os.environ['INITIAL_PROMPT']
          out=Path('out'); media=out/f'{key}.webm'
          h=hashlib.sha256(); size=0
          with requests.get(source,stream=True,timeout=180,headers={'User-Agent':'MoonformOS-Calibration/1.0'}) as r:
              r.raise_for_status()
              with media.open('wb') as f:
                  for chunk in r.iter_content(1024*1024):
                      if chunk:
                          f.write(chunk); h.update(chunk); size += len(chunk)
          container=av.open(str(media)); duration=float(container.duration/av.time_base) if container.duration else None; container.close()
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=4,num_workers=1)
          stream,info=model.transcribe(str(media),language='en',beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=True,vad_filter=True,vad_parameters={'min_silence_duration_ms':500},word_timestamps=False,initial_prompt=prompt)
          segments=[]
          for i,s in enumerate(stream):
              segments.append({'id':i,'start':round(float(s.start),3),'end':round(float(s.end),3),'text':s.text.strip(),'avg_logprob':round(float(s.avg_logprob),6),'no_speech_prob':round(float(s.no_speech_prob),6),'compression_ratio':round(float(s.compression_ratio),6)})
          text=' '.join(s['text'] for s in segments).strip()
          payload={
              'purpose':'Calibrate Moonform against an adjacent public Moon essay without using the untouched George Carlin target.',
              'key':key,'title':title,'youtube_id':video_id,'source_url':source,
              'source_sha256':h.hexdigest(),'source_bytes':size,'duration_seconds':duration,
              'asr':{'model':'small.en','language':info.language,'language_probability':float(info.language_probability),'duration':float(info.duration),'duration_after_vad':float(info.duration_after_vad),'transcribed_utc':datetime.now(timezone.utc).isoformat()},
              'segments':segments,'text':text,
          }
          (out/f'{key}_transcript.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/f'{key}_transcript.txt').write_text(text+'\n',encoding='utf-8')
          (out/f'{key}_metadata.json').write_text(json.dumps({k:payload[k] for k in ['purpose','key','title','youtube_id','source_url','source_sha256','source_bytes','duration_seconds','asr']},indent=2),encoding='utf-8')
          media.unlink()
          print(json.dumps({'key':key,'words':len(re.findall(r"\b[\w’'-]+\b",text)),'segments':len(segments),'sha256':h.hexdigest(),'duration':duration},indent=2))
          PY

      - name: Upload compact calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonform-calibration-${{ matrix.key }}
          path: out/
          if-no-files-found: error
          retention-days: 1
