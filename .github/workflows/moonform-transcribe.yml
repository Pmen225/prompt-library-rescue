# Purpose: temporarily transcribe and sample the exact public Moon validation video prospectively locked before reveal; the workflow is removed after the audit.
name: moonform-exact-validation-transcription

on:
  push:
    paths:
      - ".github/workflows/moonform-transcribe.yml"

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned transcription and frame stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper==1.2.1" "requests==2.32.5" "Pillow==11.3.0"

      - name: Download, hash and inspect exact archived source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/frames
          python - <<'PY'
          import hashlib, json, math
          from datetime import datetime, timezone
          from pathlib import Path
          import av
          import requests
          from PIL import Image, ImageOps, ImageDraw

          source = "https://archive.ventilaar.net/videos/automatic/UCmFeOdJI3IXgTBDzqBLD8qg/eGUzz-Yaf-U/how-conan-o-brien-changed-late-night-forever.webm"
          dest = Path("out/conan_exact.webm")
          h = hashlib.sha256(); size = 0
          with requests.get(source, stream=True, timeout=180, headers={"User-Agent":"MoonformOS-ExactValidation/1.2"}) as r:
              r.raise_for_status()
              with dest.open("wb") as f:
                  for chunk in r.iter_content(1024 * 1024):
                      if chunk:
                          f.write(chunk); h.update(chunk); size += len(chunk)

          container = av.open(str(dest))
          v = next((s for s in container.streams if s.type == "video"), None)
          a = next((s for s in container.streams if s.type == "audio"), None)
          duration = float(container.duration / av.time_base) if container.duration else None
          info = {
              "purpose":"Prove that all validation evidence came from the exact prospectively locked Moon source.",
              "title":"How Conan O'Brien Changed Late Night Forever",
              "youtube_id":"eGUzz-Yaf-U",
              "published":"2024-09-06",
              "archive_url":source,
              "downloaded_utc":datetime.now(timezone.utc).isoformat(),
              "bytes":size,
              "sha256":h.hexdigest(),
              "container_duration_seconds":duration,
              "video":{"codec":v.codec_context.name if v else None,"width":v.codec_context.width if v else None,"height":v.codec_context.height if v else None,"average_rate":str(v.average_rate) if v and v.average_rate else None},
              "audio":{"codec":a.codec_context.name if a else None,"sample_rate":a.codec_context.sample_rate if a else None,"channels":a.codec_context.channels if a else None},
          }
          Path("out/source_metadata.json").write_text(json.dumps(info, indent=2), encoding="utf-8")

          # Seek to each minute and retain a compact frame trail for visual inspection.
          frames=[]
          if v and duration:
              for sec in range(0, math.ceil(duration), 60):
                  container.seek(int(sec * av.time_base), any_frame=False, backward=True)
                  chosen=None
                  for frame in container.decode(video=0):
                      if frame.time is None or frame.time + 0.5 < sec:
                          continue
                      chosen=frame.to_image().convert("RGB")
                      break
                  if chosen is not None:
                      chosen.thumbnail((480,270))
                      canvas=Image.new("RGB",(480,300),"black")
                      canvas.paste(chosen,((480-chosen.width)//2,0))
                      ImageDraw.Draw(canvas).text((10,278),f"{sec//60:02d}:00",fill="white")
                      p=Path(f"out/frames/minute_{sec//60:02d}.jpg")
                      canvas.save(p,quality=88); frames.append(canvas.copy())
          if frames:
              cols=5; rows=math.ceil(len(frames)/cols)
              sheet=Image.new("RGB",(cols*480,rows*300),"black")
              for i,img in enumerate(frames): sheet.paste(img,((i%cols)*480,(i//cols)*300))
              sheet.thumbnail((1600,1600)); sheet.save("out/contact_sheet.jpg",quality=88)
          container.close()
          print(json.dumps(info, indent=2))
          PY

      - name: Run two-checkpoint ASR audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import gc, hashlib, json, re
          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from pathlib import Path
          from faster_whisper import WhisperModel

          OUT=Path("out"); MEDIA=OUT/"conan_exact.webm"
          TARGET="How Conan O'Brien Changed Late Night Forever"
          PROMPT="Conan O'Brien, Jay Leno, NBC, The Tonight Show, Late Night, David Letterman, Team Coco, TBS, Hollywood."

          def run(model_name:str, words:bool):
              model=WhisperModel(model_name,device="cpu",compute_type="int8",cpu_threads=4,num_workers=1)
              stream,info=model.transcribe(str(MEDIA),language="en",beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=True,vad_filter=True,vad_parameters={"min_silence_duration_ms":500},word_timestamps=words,initial_prompt=PROMPT)
              rows=[]
              for i,s in enumerate(stream):
                  row={"id":i,"start":round(float(s.start),3),"end":round(float(s.end),3),"text":s.text.strip(),"avg_logprob":round(float(s.avg_logprob),6),"no_speech_prob":round(float(s.no_speech_prob),6),"compression_ratio":round(float(s.compression_ratio),6)}
                  if words:
                      row["words"]=[{"start":round(float(w.start),3),"end":round(float(w.end),3),"word":w.word,"probability":round(float(w.probability),6)} for w in (s.words or []) if w.start is not None and w.end is not None]
                  rows.append(row)
              meta={"model":model_name,"language":info.language,"language_probability":float(info.language_probability),"duration":float(info.duration),"duration_after_vad":float(info.duration_after_vad),"transcribed_utc":datetime.now(timezone.utc).isoformat()}
              del model; gc.collect(); return rows,meta

          primary,pmeta=run("small.en",True); audit,ameta=run("base.en",False)
          ptext=" ".join(x["text"] for x in primary).strip(); atext=" ".join(x["text"] for x in audit).strip()
          normal=lambda t:re.findall(r"[a-z0-9']+",t.lower())
          pw,aw=normal(ptext),normal(atext); matcher=SequenceMatcher(None,pw,aw,autojunk=False)
          (OUT/"transcript_primary.json").write_text(json.dumps({"purpose":"Timestamped primary transcript for the exact locked validation video.","target":TARGET,"metadata":pmeta,"segments":primary,"text":ptext},ensure_ascii=False,indent=2),encoding="utf-8")
          (OUT/"transcript_primary.txt").write_text(ptext+"\n",encoding="utf-8")
          (OUT/"transcript_audit_base.txt").write_text(atext+"\n",encoding="utf-8")
          (OUT/"asr_audit.json").write_text(json.dumps({"purpose":"Quantify independent ASR checkpoint agreement.","primary":pmeta,"audit":ameta,"primary_words":len(pw),"audit_words":len(aw),"sequence_match_ratio":matcher.ratio(),"matching_blocks":sum(x.size for x in matcher.get_matching_blocks()),"warning":"High agreement supports semantic analysis; direct quotation still requires media spot-checking."},indent=2),encoding="utf-8")
          def ts(sec:float):
              ms=int(round(sec*1000));h,ms=divmod(ms,3600000);m,ms=divmod(ms,60000);s,ms=divmod(ms,1000);return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"
          lines=["WEBVTT","","NOTE Purpose: exact-source timed ASR evidence for Moonform validation.",""]
          for i,s in enumerate(primary,1): lines += [str(i),f"{ts(s['start'])} --> {ts(s['end'])}",s["text"],""]
          (OUT/"transcript_primary.vtt").write_text("\n".join(lines),encoding="utf-8")
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in OUT.glob("*") if p.is_file()}
          (OUT/"evidence_hashes.json").write_text(json.dumps({"purpose":"Detect post-run evidence modification.","sha256":hashes},indent=2),encoding="utf-8")
          print(json.dumps({"primary_words":len(pw),"audit_words":len(aw),"agreement":matcher.ratio(),"segments":len(primary)},indent=2))
          PY

      - name: Upload exact immutable validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonform-conan-exact-validation
          path: out/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
